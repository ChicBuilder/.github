name: 🚀 Feature Request
description: Propose an idea, new component, or builder enhancement for Chic Builder
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chic Builder! Please describe your proposed feature or component below.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the challenge or friction is.
      placeholder: "I'm looking for a cleaner way to build..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Component
      description: Describe what you'd like to see added or improved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
